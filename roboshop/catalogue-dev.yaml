apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogue-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shekharreddy-e/catalogue-unit-test-actions.git
    targetRevision: main
    path: helm
    helm:
      valueFiles: |
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc # current EKS cluster
    namespace: roboshop-dev
  syncPolicy:
    automated:
      prune: true # if deleted in git, delete in cluster also
      selfHeal: true # if someone manually change through CLI, do the self heal